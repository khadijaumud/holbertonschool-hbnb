<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Add Review</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="logo.png" alt="HBnB Logo" class="logo" onclick="window.location.href='index.html'">
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2>Add Review</h2>
            <form id="review-form">
                <div class="form-group">
                    <label for="review-rating">Rating (1-5)</label>
                    <select id="review-rating" required>
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Good</option>
                        <option value="3">3 - Average</option>
                        <option value="2">2 - Poor</option>
                        <option value="1">1 - Terrible</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="review-text">Your Comment</label>
                    <textarea id="review-text" rows="5" required placeholder="Type your experience here..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Submit Review</button>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2026 HBnB Project. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
