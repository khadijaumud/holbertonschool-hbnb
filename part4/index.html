<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Home</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="logo.png" alt="HBnB Logo" class="logo" onclick="window.location.href='index.html'">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" id="login-link" class="login-button">Login</a>
            <button id="logout-button" class="login-button" style="display: none; background-color: #333; border: none; cursor: pointer;">Logout</button>
        </nav>
    </header>

    <main>
        <div class="filter-section">
            <label for="price-filter">Filter by Max Price ($):</label>
            <select id="price-filter">
                <option value="All">All</option>
                <option value="10">10</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </div>

        <section id="places-list" class="places-grid">
            </section>
    </main>

    <footer>
        <p>© 2026 HBnB Project. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
