<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="logo.png" alt="HBnB Logo" class="logo" onclick="window.location.href='index.html'">
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2>Login to HBnB</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="admin@hbnb.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="******">
                </div>
                <button type="submit" class="submit-btn">Login</button>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2026 HBnB Project. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
